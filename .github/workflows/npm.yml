name: npm

on:
  push:
    tags: ["v*"]

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: validate version
        id: version
        working-directory: client
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "package version $package_version does not match $RELEASE_TAG" >&2
            exit 1
          fi
          echo "value=$package_version" >> "$GITHUB_OUTPUT"
          if [[ "$package_version" == *-rc.* ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: check registry
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if npm view "@k2b/rsql@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.registry.outputs.publish == 'true'
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-go@v7
        if: steps.registry.outputs.publish == 'true'
        with:
          go-version: "1.23"
          cache: true

      - name: download Go modules
        if: steps.registry.outputs.publish == 'true'
        run: go mod download

      - name: install
        if: steps.registry.outputs.publish == 'true'
        working-directory: client
        run: bun install --frozen-lockfile

      - name: typecheck
        if: steps.registry.outputs.publish == 'true'
        working-directory: client
        run: bun run typecheck

      - name: test
        if: steps.registry.outputs.publish == 'true'
        working-directory: client
        run: bun test --timeout 60000

      - name: package smoke
        if: steps.registry.outputs.publish == 'true'
        working-directory: client
        run: bun run test:package

      - name: update npm
        if: steps.registry.outputs.publish == 'true'
        run: npm install --global npm@12.0.1

      - name: publish
        if: steps.registry.outputs.publish == 'true'
        working-directory: client
        env:
          NPM_TAG: ${{ steps.version.outputs.tag }}
        run: npm publish --access public --provenance --tag "$NPM_TAG"
