name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race ./...

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The client e2e suite spawns the rsql server binary, so Go is required.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # Pre-fetch the Go module cache so the per-test `go build` does not
      # have to download modules and risk pipe-buffer pressure.
      - name: go mod download
        run: go mod download

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: install
        working-directory: client
        run: bun install --frozen-lockfile

      - name: typecheck
        working-directory: client
        run: bun run typecheck

      - name: build
        working-directory: client
        run: bun run build

      # Bun's default test timeout (5 s) is shorter than a cold `go build`
      # on a fresh runner. The first test that triggers the per-suite
      # binary build needs more headroom.
      - name: test
        working-directory: client
        run: bun test --timeout 60000

      - name: package smoke
        working-directory: client
        run: bun run test:package

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run docs:typecheck

      - name: build
        run: bun run docs:build
